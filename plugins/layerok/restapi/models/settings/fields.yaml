fields:
    bonus_enabled:
        label: "Бонусы включены"
        comment: "Баллы начисляет Poster. Бэкенд только списывает их при закрытии заказа."
        type: switch
        span: left
        default: false
    max_bonus:
        label: "Какой процент заказа можно оплатить бонусами (0-100%)"
        comment: "Считается только от товаров, категории которых не исключены ниже."
        type: number
        span: left
        min: 0
        max: 100
        default: 20
        trigger:
            action: enable
            field: bonus_enabled
            condition: checked
    bonus_excluded_categories:
        label: "Категории, которые не учитываются при оплате бонусами"
        comment: "Стоимость товаров из этих категорий не входит в базу для расчёта лимита бонусов."
        type: checkboxlist
        span: full
        options: getBonusExcludedCategoriesOptions
        trigger:
            action: enable
            field: bonus_enabled
            condition: checked
