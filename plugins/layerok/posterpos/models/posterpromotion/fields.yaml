fields:
    name:
        label: Название (из Poster)
        disabled: true
        span: left
    poster_promotion_id:
        label: Poster ID
        disabled: true
        span: right
    _window_section:
        type: section
        label: Когда действует
        comment: 'Когда бэкенд применяет акцию к онлайн-заказам, время по Киеву. Пусто — без ограничений (расписание самой акции в Poster учитывается всегда).'
    active_days:
        label: Дни недели
        type: checkboxlist
        quickselect: true
        cssClass: inline-options
        comment: 'Ничего не отмечено — каждый день. При времени через полночь (22:00 — 02:00) часы после полуночи относятся к дню начала: «Пт» действует и в субботу до 02:00.'
        span: full
    active_from:
        label: Действует с (ЧЧ:ММ)
        placeholder: '11:00'
        comment: 'Например 11:00 — 22:00 действует до 21:59. Можно через полночь: 22:00 — 02:00.'
        span: left
    active_to:
        label: Действует до (ЧЧ:ММ)
        placeholder: '22:00'
        span: right
