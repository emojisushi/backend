<div data-control="toolbar">
    <button
        type="button"
        class="btn btn-primary oc-icon-download"
        data-request="onImport"
        data-stripe-load-indicator>
        Импортировать из Poster
    </button>

    <span class="text-muted" style="margin-left: 12px;">
        Акции копируются из всех Poster-аккаунтов. Включить можно только те, что бэкенд умеет применять

        Нажмите на акцию, чтобы задать время её действия.
    </span>
</div>
